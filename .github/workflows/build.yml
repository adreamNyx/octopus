# Trigger: manual dispatch, dev push, or PR with build label
name: Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'build'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')" pnpm build

      - name: Embed frontend into static
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Build binaries
        run: |
          set -e
          mkdir -p build/bin build/docker/linux/amd64 build/docker/linux/arm64
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          GIT_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          # Point the in-app updater at this fork's releases (internal/update defaults to upstream).
          UPDATE_URL="https://github.com/adreamNyx/octopus/releases/latest/download"
          UPDATE_API_URL="https://api.github.com/repos/adreamNyx/octopus/releases/latest"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${GIT_VERSION}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=hureru' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -X 'github.com/bestruirui/octopus/internal/update.updateUrl=${UPDATE_URL}' \
                   -X 'github.com/bestruirui/octopus/internal/update.updateApiUrl=${UPDATE_API_URL}' \
                   -s -w"

          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -o build/bin/octopus-linux-x86_64        -ldflags="${LDFLAGS}" -tags=jsoniter ./
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -o build/bin/octopus-linux-arm64         -ldflags="${LDFLAGS}" -tags=jsoniter ./
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o build/bin/octopus-windows-x86_64.exe  -ldflags="${LDFLAGS}" -tags=jsoniter ./
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -o build/bin/octopus-darwin-arm64        -ldflags="${LDFLAGS}" -tags=jsoniter ./

          cp build/bin/octopus-linux-x86_64 build/docker/linux/amd64/octopus
          cp build/bin/octopus-linux-arm64  build/docker/linux/arm64/octopus

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: octopus-binaries-${{ github.sha }}
          path: build/bin/
          retention-days: 7
          if-no-files-found: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (Alpine, amd64+arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/adreamnyx/octopus:dev
            ghcr.io/adreamnyx/octopus:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (Debian, amd64+arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/adreamnyx/octopus:dev-debian
            ghcr.io/adreamnyx/octopus:dev-debian-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (Alpine amd64)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          platforms: linux/amd64
          load: true
          tags: octopus:ci-${{ github.sha }}-alpine-amd64
          build-args: |
            TARGETPLATFORM=linux/amd64

      - name: Build Docker image (Alpine arm64)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          platforms: linux/arm64
          load: true
          tags: octopus:ci-${{ github.sha }}-alpine-arm64
          build-args: |
            TARGETPLATFORM=linux/arm64

      - name: Build Docker image (Debian amd64)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          platforms: linux/amd64
          load: true
          tags: octopus:ci-${{ github.sha }}-debian-amd64
          build-args: |
            TARGETPLATFORM=linux/amd64

      - name: Build Docker image (Debian arm64)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          platforms: linux/arm64
          load: true
          tags: octopus:ci-${{ github.sha }}-debian-arm64
          build-args: |
            TARGETPLATFORM=linux/arm64

      - name: Export Docker images
        if: github.event_name == 'pull_request'
        run: |
          set -e
          mkdir -p build/docker-images
          docker save octopus:ci-${{ github.sha }}-alpine-amd64 | gzip > build/docker-images/octopus-alpine-amd64.tar.gz
          docker save octopus:ci-${{ github.sha }}-alpine-arm64 | gzip > build/docker-images/octopus-alpine-arm64.tar.gz
          docker save octopus:ci-${{ github.sha }}-debian-amd64 | gzip > build/docker-images/octopus-debian-amd64.tar.gz
          docker save octopus:ci-${{ github.sha }}-debian-arm64 | gzip > build/docker-images/octopus-debian-arm64.tar.gz

      - name: Upload Docker images
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: octopus-docker-${{ github.sha }}
          path: build/docker-images/
          retention-days: 7
          if-no-files-found: error

  release:
    name: release
    # Only publish release assets when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for README/LICENSE in zips)
        uses: actions/checkout@v5

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: octopus-binaries-${{ github.sha }}
          path: build/bin/

      - name: Package zips
        # Zip layout must match internal/update.unzip: the binary is extracted
        # next to the running executable, so it must be named 'octopus'.
        run: |
          set -e
          mkdir -p build/release
          pack() {
            src="$1"; inner="$2"; out="$3"
            stage="$(mktemp -d)"
            cp "build/bin/${src}" "${stage}/${inner}"
            cp README.md LICENSE "${stage}/"
            (cd "${stage}" && zip -q -X "${GITHUB_WORKSPACE}/build/release/${out}" "${inner}" README.md LICENSE)
            rm -rf "${stage}"
          }
          pack octopus-linux-x86_64       octopus      octopus-linux-x86_64.zip
          pack octopus-linux-arm64        octopus      octopus-linux-arm64.zip
          pack octopus-windows-x86_64.exe octopus.exe  octopus-windows-x86_64.zip
          pack octopus-darwin-arm64       octopus      octopus-darwin-arm64.zip
          ls -la build/release/
          unzip -l build/release/octopus-linux-arm64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.zip
          generate_release_notes: true
